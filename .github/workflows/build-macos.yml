name: Build App
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macOS-arm64
          - os: windows-latest
            name: Windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webapp/frontend/package-lock.json
      - name: Verify and build current frontend
        working-directory: webapp/frontend
        run: |
          npm ci
          npm run verify
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU engine and packaging tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install kornia opencv-python-headless numpy Pillow matplotlib scikit-image
          python -m pip install sam2 huggingface_hub fastapi uvicorn python-multipart pyinstaller pytest httpx
      - name: Verify API and geometry contracts
        run: python -m pytest tests/test_workspace_api.py tests/test_similarity_only.py -q
      - name: Build native application
        run: python scripts/build_desktop.py
      - name: Start actual executable and verify workspace
        run: python scripts/smoke_desktop.py
      - name: Zip Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/DKPregistrator/* -DestinationPath DKPregistrator-${{ matrix.name }}.zip
      - name: Zip macOS application preserving permissions
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/DKPregistrator.app DKPregistrator-${{ matrix.name }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: DKPregistrator-${{ matrix.name }}
          path: DKPregistrator-${{ matrix.name }}.zip
          if-no-files-found: error
          retention-days: 30
      - name: Attach executables to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: DKPregistrator-${{ matrix.name }}.zip
          fail_on_unmatched_files: true
